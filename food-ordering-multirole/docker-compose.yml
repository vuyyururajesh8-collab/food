services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: food_ordering
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d food_ordering"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/food_ordering
      DB_USERNAME: fooduser
      DB_PASSWORD: foodpass
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
  portal:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./portal:/app", "/app/node_modules"]
    command: sh -c "npm install && npm run dev -- --port 4173"
    ports: ["4173:4173"]
  customer:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./customer-frontend:/app", "/app/node_modules"]
    command: sh -c "npm install && npm run dev -- --port 5173"
    ports: ["5173:5173"]
  hotel:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./hotel-frontend:/app", "/app/node_modules"]
    command: sh -c "npm install && npm run dev -- --port 5174"
    ports: ["5174:5174"]
volumes:
  postgres_data:
